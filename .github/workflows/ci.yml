name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Configure + build
        run: ./scripts/bootstrap.sh

      - name: Test
        run: ./scripts/test.sh
